name: Link check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write # ДЕФИС! pull_requests — невалидное имя: GitHub отклонял workflow (HTTP 422 "Unexpected value 'pull_requests'"). Без этого права gh pr create падал: "Resource not accessible by integration"

concurrency:
  group: linkcheck
  cancel-in-progress: false

jobs:
  check:
    name: Check t.me links and report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run link checker with verified stamping
        run: node scripts/check-links.mjs --out link-report.md --stamp-verified

      # Verified-обновления идут через PR: защита main запрещает прямые пуши
      # (required PR + checks + enforce admins) — и GITHUB_TOKEN не исключение.
      # Бот создаёт ветку и PR; мержить — за человеком (или админ-мержем ниже).
      - name: Create auto-PR with verified updates
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: "chore: автопроверка — verified обновлён"
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "verified: изменений нет — PR не нужен."
            exit 0
          fi
          BRANCH="auto/verified-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Снапшот liveness (data/liveness/) — новые untracked-файлы, git diff их
          # не видит, поэтому проверка выше учитывает ls-files --others.
          git add data/bots.json data/liveness README.md README_EN.md
          # ВАЖНО: без [skip ci]. С [skip ci] workflows не запускались бы на
          # этом коммите (документация GitHub: skipping-workflow-runs), required
          # check "Validate data and README" остался бы "Expected" навсегда —
          # и смёрджить авто-PR смог бы только админ с bypass. Пусть CI гоняется:
          # check бесплатный, а merge становится доступен обычным путём.
          git commit -m "chore: auto-verify bots — verified stamped by weekly check"
          # R7 (раунд 10): повторный прогон в тот же день падал на push — ветка
          # auto/verified-<дата> остаётся после squash-мерджа PR (GitHub её не
          # удаляет), и push без pull получал rejected (воспроизведено: run
          # 40382748812). Force-push перезаписывает ветку дня состоянием main+фикс:
          # если открытый PR того же дня существует — gh pr create скажет «уже
          # существует», а коммит в его ветке обновится и CI прогонится заново.
          git push --force origin "HEAD:$BRANCH"
          # Тело PR: отчёт, если он непуст; иначе — пояснение. Проверка -s (а не
          # "cat ... || echo"): cat пустого файла возвращает код 0, поэтому
          # fallback не срабатывал и PR создавался с ПУСТЫМ описанием.
          if [ -s link-report.md ]; then
            BODY=$(cat link-report.md)
          else
            BODY="Все боты живы, мёртвых нет. verified обновлён до текущего месяца."
          fi
          gh pr create --title "$PR_TITLE" --body "$BODY" --base main --head "$BRANCH" || echo "PR уже существует"

      - name: Open or update issue when dead links are found
        if: always() # отчёт записан до exit 1 — Issue создаём даже при найденных мёртвых ботах
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Сбой метода (заголовок отчёта) — отдельный титул и БЕЗ метки broken:
          # раньше рейт-лимит/поломка разметки получали метку «боты дохнут»,
          # что вводило в заблуждение (N9, раунд 7 охоты).
          # P4 (раунд 8): оба титула содержат «Автопроверка», поэтому поиск
          # по подстроке "Автопроверка in:title" матчил ОБА Issue — комменты о
          # мёртвых улетали в Issue о сбое и наоборот. Каждый поиск ведёт по
          # своей уникальной части титула.
          if [ -s link-report.md ] && head -1 link-report.md | grep -q "сбой метода"; then
            TITLE="Автопроверка: сбой метода (проверка не завершена)"
            ISSUE=$(gh issue list --state open --search "сбой метода in:title" --json number --jq '.[0].number')
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body-file link-report.md
            else
              gh issue create --title "$TITLE" --body-file link-report.md
            fi
            exit 0
          fi
          TITLE="Автопроверка: возможно нерабочие боты"
          ISSUE=$(gh issue list --state open --search "возможно нерабочие боты in:title" --json number --jq '.[0].number')
          if [ -s link-report.md ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body-file link-report.md
            else
              gh issue create --title "$TITLE" --body-file link-report.md --label broken
            fi
          else
            echo "Мёртвых ссылок нет."
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Обновление: все ссылки доступны ✅" && gh issue close "$ISSUE"
            fi
            # Q1 (раунд 9): сбой-Issue тоже закрываем при восстановлении метода —
            # раньше висел вечно, и каждый сбой плодил новый вечный Issue.
            ISSUE_M=$(gh issue list --state open --search "сбой метода in:title" --json number --jq '.[0].number')
            if [ -n "$ISSUE_M" ]; then
              gh issue comment "$ISSUE_M" --body "Обновление: метод проверки восстановлен, полный прогон прошёл без сбоев ✅" && gh issue close "$ISSUE_M"
            fi
          fi
