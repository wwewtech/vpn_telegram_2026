name: Link check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: linkcheck
  cancel-in-progress: false

jobs:
  check:
    name: Check t.me links and report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run link checker with verified stamping
        run: node scripts/check-links.mjs --out link-report.md --stamp-verified

      - name: Commit verified updates (only when nothing is dead)
        if: success()
        run: |
          if git diff --quiet; then
            echo "verified: изменений нет."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/bots.json README.md
            git commit -m "chore: auto-verify bots (monthly stamp) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Open or update issue when dead links are found
        if: always() # отчёт записан до exit 1 — Issue создаём даже при найденных мёртвых ботах
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Автопроверка: возможно нерабочие боты"
          ISSUE=$(gh issue list --state open --search "Автопроверка in:title" --json number --jq '.[0].number')
          if [ -s link-report.md ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body-file link-report.md
            else
              gh issue create --title "$TITLE" --body-file link-report.md --label broken
            fi
          else
            echo "Мёртвых ссылок нет."
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Обновление: все ссылки доступны ✅" && gh issue close "$ISSUE"
            fi
          fi
