name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate data and README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run unit tests
        run: node --test

      - name: Validate data, sorting and links
        run: node scripts/validate.mjs

      - name: Check that README.md is regenerated and sorted
        run: node scripts/generate-readme.mjs --check
